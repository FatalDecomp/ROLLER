[tools]
cmake = "3.30.2"
ninja = "1.12.0"
"pipx:mdformat" = { version = "1.0.0", uvx_args = "--with mdformat-gfm==1.0.0 --with mdformat-frontmatter==2.1.2" }
python = "3"
"ubi:zigtools/zls" = "0.15.0"
usage = "latest"
uv = "0.12.2"
zig = "0.15.2"

[env]
EMSDK = "{{config_root}}/.tools/emsdk"
EM_CONFIG = "{{config_root}}/.tools/emsdk/.emscripten"
_.path = [
  "{{config_root}}/.tools/emsdk",
  "{{config_root}}/.tools/emsdk/upstream/emscripten",
  "{{config_root}}/.tools/emsdk/upstream/bin",
]

[hooks]
postinstall = { task = "install-emsdk" }

[tasks.build]
description = "Build for specific platform"
run = "python scripts/build.py"

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf zig-out .zig-cache"

[tasks.test]
description = "Run tests"
run = "zig build test"

[tasks.format-markdown]
description = "Format Markdown"
run = "git ls-files -z '*.md' ':!:LICENSE.md' | xargs -0 mdformat"

[tasks.lint-markdown]
description = "Check Markdown formatting"
run = "git ls-files -z '*.md' ':!:LICENSE.md' | xargs -0 mdformat --check"

[tasks.install-emsdk]
description = "Install the pinned Emscripten SDK"
run = "python scripts/install_emsdk.py"
