name: Lint Markdown

on:
  push:
    paths:
      - "CONTEXT.md"
      - "docs/**/*.md"
      - ".rumdl.toml"
      - "mise.toml"
      - ".github/workflows/markdown-lint.yml"
  pull_request:
    paths:
      - "CONTEXT.md"
      - "docs/**/*.md"
      - ".rumdl.toml"
      - "mise.toml"
      - ".github/workflows/markdown-lint.yml"

permissions:
  contents: read

jobs:
  lint-markdown:
    name: Check architecture Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run rumdl
        uses: rvben/rumdl@v0
        with:
          version: "0.2.50"
          path: .
          config: .rumdl.toml
          report-type: annotations
