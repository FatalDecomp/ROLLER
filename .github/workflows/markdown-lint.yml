name: Lint Markdown

on:
  push:
    paths:
      - "**/*.md"
      - ".mdformat.toml"
      - "mise.toml"
      - ".github/workflows/markdown-lint.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".mdformat.toml"
      - "mise.toml"
      - ".github/workflows/markdown-lint.yml"

permissions:
  contents: read

jobs:
  lint-markdown:
    name: Check Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          experimental: true
          cache: true

      - name: Check Markdown formatting
        run: mise run lint-markdown
