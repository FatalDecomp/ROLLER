name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        description: "Version string for the build"
      semver_version:
        required: false
        type: string
        description: "Semver version string for nightly/dev builds"
      git_hash:
        required: false
        type: string
        description: "Full git hash for the build"
      short_hash:
        required: false
        type: string
        description: "Short git hash for the build; legacy fallback"
      build_date:
        required: false
        type: string
        description: "UTC build date for build identity"
      dev_build:
        required: false
        type: boolean
        default: false
        description: "Build with nightly/dev crash debugging settings"
      run_soak:
        required: false
        type: boolean
        default: false
        description: >-
          E6-S5. Run the load/render/reload soak under Valgrind. Off for pushes
          and pull requests because it is slow; the nightly turns it on, and a
          failure there blocks the nightly release.

jobs:
  validate-game-targets:
    name: Validate six-target game build contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate game build matrix
        run: python tools/check_game_build_matrix.py

      - name: Validate Zig and CMake source sets
        run: python tools/check_source_set_drift.py

      - name: Validate the roller-core CMake job and its SDL pins
        run: python tools/check_core_cmake_ci.py

      - name: Validate the sanitizer soak job and its release gate
        run: python tools/check_soak_sanitizer_ci.py

  # E6-S4. Until now ROLLER CI validated the CMake *source lists* and nothing
  # else: check_source_set_drift.py can be perfectly happy while the CMake build
  # is broken outright. The only thing that actually compiled roller-core was
  # TrackEditor's CI, and that builds the pinned submodule commit rather than
  # ROLLER master -- so a break here stayed invisible until somebody moved the
  # pin. This job closes that.
  roller-core-cmake:
    name: roller-core CMake (${{ matrix.name }})
    needs: validate-game-targets
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      # One platform's compiler disagreeing is exactly what this job exists to
      # surface, so never hide the other two behind it.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # 26.04 is the release that carries binary SDL3 packages; this
            # matches the label TrackEditor's own CI settled on.
            runs-on: ubuntu-26.04
            generator-args: '-G Ninja'
            link-test: build-core/editor-core-link-test
          - name: macOS
            runs-on: macos-15
            generator-args: '-G Ninja'
            link-test: build-core/editor-core-link-test
          - name: Windows
            runs-on: windows-2022
            generator-args: '-G "Visual Studio 17 2022" -A x64'
            link-test: build-core/Release/editor-core-link-test.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install SDL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl3-dev libsdl3-image-dev ninja-build

      - name: Install SDL (macOS)
        if: runner.os == 'macOS'
        run: brew install --force-bottle sdl3 sdl3_image ninja

      - name: Install SDL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install-sdl-windows.ps1 -Destination "$env:RUNNER_TEMP\sdl"

      # Core-only, which is how TrackEditor consumes it: no game, and therefore
      # no WildMidi and no libcdio. ROLLER_WARNINGS_AS_ERRORS stays off -- the
      # legacy sources are not warning-clean, and making them so is not this
      # story's business.
      - name: Configure roller-core only
        shell: bash
        run: >-
          cmake -S . -B build-core
          ${{ matrix.generator-args }}
          -DCMAKE_BUILD_TYPE=Release
          -DROLLER_BUILD_EDITOR_CORE=ON
          -DROLLER_BUILD_GAME=OFF

      - name: Build roller-core
        shell: bash
        run: cmake --build build-core --config Release --parallel

      # Compiling is not enough: ed0dd05 made ROLLER::core consumer-linkable,
      # and a missing symbol only shows up when something links it.
      - name: Link and run a consumer of ROLLER::core
        shell: bash
        run: ./${{ matrix.link-test }}

  # E6-S5. The sanitizer half of E1-S9. This job lives in the reusable workflow
  # rather than in a standalone scheduled one for a specific reason: the nightly
  # release job depends on this whole workflow, so a memory error found here
  # fails the workflow and the release is never created. A separate scheduled
  # workflow would report the failure and publish the release anyway.
  soak-sanitizer:
    name: Soak under Valgrind
    if: inputs.run_soak
    needs: validate-game-targets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          experimental: true
          cache: true

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      # The facade lifecycle tests drive init -> load -> render -> unload ->
      # shutdown across valid, malformed, and oversized tracks. They prove each
      # transition is correct once; E1-S9's soak below proves nothing
      # accumulates when they repeat. ReleaseSafe matches the configuration
      # ci.yml already runs these under; Debug would give sharper traces but has
      # a known SDL3_image UBSan link problem.
      # -Dcpu=baseline is not optional here. The build otherwise targets the
      # runner's native CPU, and ubuntu-latest lands on Ice Lake Xeons with
      # AVX-512: `editor_surface.c` compiled for one emits vpermt2ps,
      # vpcmpltud, vpmovm2d and vcvtudq2ps, none of which Valgrind 3.22 can
      # decode. It raises SIGILL inside ed_emit_surface -- which reads as a
      # wild jump and is nothing of the kind. Baseline costs speed the
      # instrumentation has already spent.
      - name: Run the facade lifecycle boundary under Valgrind
        run: zig build test-editor-api -Dvalgrind -Doptimize=ReleaseSafe -Dcpu=baseline

      # The soak needs a real track and its textures. The retail FATDATA tree
      # is not redistributable; the freeware demo assets ADR 0004 covers are,
      # and ci.yml already builds F-S2/F-S3 on them.
      - name: Prepare verified freeware demo assets
        run: python scripts/fetch_demo_assets.py

      # E1-S9 proper: hundreds of load/render/reload cycles against a real
      # track with a malformed file in every one of them. This is the soak this
      # job was built to run.
      - name: Run the E1-S9 reload soak under Valgrind
        run: >-
          zig build test-e1-s9-reload-soak -Dvalgrind
          -Doptimize=ReleaseSafe
          -Dcpu=baseline
          -Dassets-path=zig-out/fatdata-demo
          -Dsoak-track=TRACK5.TRK
          -Dsoak-cycles=250

  build:
    name: Build for ${{ matrix.os }} ${{ matrix.arch }}
    needs: validate-game-targets
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-gnu
            runs-on: ubuntu-latest
            os: linux
            arch: aarch64
            ext: ""
          - target: x86_64-linux-gnu
            runs-on: ubuntu-latest
            os: linux
            arch: x86_64
            ext: ""
          - target: x86_64-windows
            runs-on: ubuntu-latest
            os: windows
            arch: x86_64
            ext: ".exe"
          - target: aarch64-macos
            runs-on: macos-15
            os: macos
            arch: aarch64
            ext: ""
          - target: x86_64-macos
            runs-on: macos-15-intel
            os: macos
            arch: x86_64
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          experimental: true
          cache: true

      - name: Cache .zig-cache
        uses: actions/cache@v5
        with:
          path: .zig-cache
          key: zig-cache-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-${{ matrix.os }}-${{ matrix.arch }}-
            zig-cache-

      - name: Build for ${{ matrix.os }} ${{ matrix.arch }}
        env:
          BUILD_VERSION: ${{ inputs.semver_version || inputs.version || 'local' }}
          BUILD_HASH: ${{ inputs.git_hash || inputs.short_hash || github.sha || 'unknown' }}
          BUILD_DATE_INPUT: ${{ inputs.build_date }}
          DEV_BUILD: ${{ inputs.dev_build }}
          MATRIX_RELEASE: ${{ matrix.release || '' }}
        run: |
          BUILD_DATE_VALUE="$BUILD_DATE_INPUT"
          if [ -z "$BUILD_DATE_VALUE" ]; then
            BUILD_DATE_VALUE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          fi

          RELEASE_MODE="$MATRIX_RELEASE"
          if [ -z "$RELEASE_MODE" ]; then
            if [ "$DEV_BUILD" = "true" ]; then
              RELEASE_MODE="safe"
            else
              RELEASE_MODE="fast"
            fi
          fi

          CRASH_DEBUG_ARGS=""
          if [ "$DEV_BUILD" = "true" ]; then
            CRASH_DEBUG_ARGS="--crash-debug"
          fi

          BUILD_ID_ARGS=""
          if [ "${{ matrix.os }}" = "linux" ]; then
            BUILD_ID_ARGS="--build-id=sha1"
          fi

          mise run build \
            --target=${{ matrix.target }} \
            --release="$RELEASE_MODE" \
            --version="$BUILD_VERSION" \
            --git-hash="$BUILD_HASH" \
            --build-date="$BUILD_DATE_VALUE" \
            --build-target=${{ matrix.target }} \
            $CRASH_DEBUG_ARGS \
            $BUILD_ID_ARGS

      - name: Create output folder
        run: |
          mkdir -p dist

      - name: Copy files to output folder
        run: |
          cp zig-out/bin/* dist/
          cp -r midi dist/
          cp images/roller.ico dist/
          cp README.md dist/
          cp LICENSE.md dist/

      - name: Install Linux symbol tools
        if: matrix.os == 'linux' && inputs.dev_build
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo apt-get update
            sudo apt-get install -y binutils-aarch64-linux-gnu
          fi

      - name: Create Linux debug symbols
        if: matrix.os == 'linux' && inputs.dev_build
        run: |
          OBJCOPY=objcopy
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            OBJCOPY=aarch64-linux-gnu-objcopy
          fi
          "$OBJCOPY" --only-keep-debug dist/roller dist/roller.debug
          "$OBJCOPY" --strip-debug --strip-unneeded dist/roller
          "$OBJCOPY" --add-gnu-debuglink=dist/roller.debug dist/roller

      - name: Create macOS debug symbols
        if: matrix.os == 'macos' && inputs.dev_build
        run: |
          dsymutil dist/roller -o dist/roller.dSYM

      - name: Verify debug symbols
        if: inputs.dev_build
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            test -f dist/roller.pdb
          elif [ "${{ matrix.os }}" = "linux" ]; then
            test -f dist/roller.debug
          elif [ "${{ matrix.os }}" = "macos" ]; then
            test -d dist/roller.dSYM
          fi

      - name: Package Windows/macOS build
        if: matrix.os == 'macos' || matrix.os == 'windows'
        run: |
          cd dist && zip -r ../roller-${{ matrix.os }}-${{ matrix.arch }}.zip *

      - name: Package Linux build
        if: matrix.os == 'linux'
        run: |
          cd dist && tar -czf ../roller-${{ matrix.os }}-${{ matrix.arch }}.tar.gz *

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: roller-${{ matrix.os }}-${{ matrix.arch }}
          path: roller-${{ matrix.os }}-${{ matrix.arch }}.*
          retention-days: 7

  android:
    name: Build Android APK
    needs: validate-game-targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          experimental: true
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: roller-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
